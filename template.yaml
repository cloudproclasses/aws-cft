AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudFormation template to create a VPC, a public subnet, an Internet Gateway,
  and conditional EC2 instances based on the Environment parameter (dev vs prod).

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Specify the environment (dev or prod)

  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64'
    Description: Automatically fetches the latest Amazon Linux 2023 AMI ID.

Conditions:
  IsProd: !Equals [!Ref Environment, 'prod']

Resources:
  # 1. VPC Configuration
  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-vpc'

  # 2. Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-igw'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref MyVPC
      InternetGatewayId: !Ref InternetGateway

  # 3. Public Subnet
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-public-subnet'

  # 4. Route Table & Route
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MyVPC
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # 5. Security Group
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable SSH and HTTP access
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-sg'

  # 6. EC2 Instances
  # Instance 1: Created for both dev and prod, type changes based on environment
  EC2Instance1:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !If [IsProd, 't3.micro', 't2.micro']
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-instance-1'

  # Instance 2: Created ONLY in prod
  EC2Instance2:
    Type: AWS::EC2::Instance
    Condition: IsProd
    Properties:
      InstanceType: 't3.micro'
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-instance-2'

  # Instance 3: Created ONLY in prod
  EC2Instance3:
    Type: AWS::EC2::Instance
    Condition: IsProd
    Properties:
      InstanceType: 't3.micro'
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-instance-3'

Outputs:
  Instance1PublicDNS:
    Description: Public DNS of Instance 1
    Value: !GetAtt EC2Instance1.PublicDnsName

  Instance2PublicDNS:
    Description: Public DNS of Instance 2 (Prod only)
    Condition: IsProd
    Value: !GetAtt EC2Instance2.PublicDnsName

  Instance3PublicDNS:
    Description: Public DNS of Instance 3 (Prod only)
    Condition: IsProd
    Value: !GetAtt EC2Instance3.PublicDnsName
